name: Frontend

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  card:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Check the committed bundle is up to date
        run: git diff --exit-code -- ../custom_components/bts_arrival_time/frontend/
